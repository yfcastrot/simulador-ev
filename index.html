const {LineChart,Line,BarChart,Bar,XAxis,YAxis,CartesianGrid,Tooltip,
       ResponsiveContainer,ReferenceLine,Area,AreaChart,Legend,Cell}=Recharts;

const G="#F5A623",OR="#ff9f7a",RD="#ff5f5f";
const fmt=n=>new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(n);
const fmtM=n=>Math.abs(n)>=1e9?"$"+(n/1e9).toFixed(1)+"B":Math.abs(n)>=1e6?"$"+(n/1e6).toFixed(1)+"M":fmt(n);

function Tip({active,payload,label}){
  if(!active||!payload||!payload.length)return null;
  return React.createElement("div",{style:{background:"#0e1628",border:"1px solid rgba(245,166,35,0.3)",borderRadius:8,padding:"9px 13px"}},
    React.createElement("div",{style:{color:G,fontFamily:"monospace",fontSize:11,marginBottom:5}},label),
    payload.map((p,i)=>React.createElement("div",{key:i,style:{fontSize:11,color:p.color||"#fff",marginBottom:2}},p.name+": ",React.createElement("strong",null,fmtM(p.value))))
  );
}

function Slider({label,value,min,max,step,onChange,unit,helper}){
  return(
    <div style={{marginBottom:16}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
        <span style={{fontSize:10,color:"#8a9fc0",fontWeight:600,textTransform:"uppercase",letterSpacing:"0.06em"}}>{label}</span>
        <span style={{fontFamily:"monospace",fontSize:12,color:"#fff",fontWeight:700}}>{unit==="COP"?fmtM(value):value.toLocaleString("es-CO")+" "+unit}</span>
      </div>
      {helper&&<div style={{fontSize:9,color:"#3a5280",marginBottom:3}}>{helper}</div>}
      <input type="range" min={min} max={max} step={step} value={value} onChange={e=>onChange(Number(e.target.value))}/>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:9,color:"#2a3d60",marginTop:2}}>
        <span>{unit==="COP"?fmtM(min):min+" "+unit}</span>
        <span>{unit==="COP"?fmtM(max):max+" "+unit}</span>
      </div>
    </div>
  );
}

function KPI({label,value,sub,color,big}){
  return(
    <div style={{background:"rgba(27,58,110,0.2)",border:"1px solid rgba(245,166,35,0.15)",borderRadius:10,padding:13,flex:1,minWidth:130}}>
      <div style={{fontSize:9,color:"#4a6290",textTransform:"uppercase",letterSpacing:"0.1em",fontWeight:600,marginBottom:5}}>{label}</div>
      <div style={{fontSize:big?19:15,fontWeight:800,color:color||G,fontFamily:"monospace",lineHeight:1}}>{value}</div>
      {sub&&<div style={{fontSize:9,color:"#3a5280",marginTop:4}}>{sub}</div>}
    </div>
  );
}

function ST({children}){
  return(
    <div style={{display:"flex",alignItems:"center",gap:8,margin:"20px 0 12px"}}>
      <div style={{width:3,height:15,background:G,borderRadius:2}}/>
      <span style={{fontSize:11,color:G,letterSpacing:"0.12em",textTransform:"uppercase",fontWeight:700}}>{children}</span>
    </div>
  );
}

function Card({children}){
  return <div style={{background:"linear-gradient(135deg,#0e1628,#0a1020)",border:"1px solid rgba(27,58,110,0.6)",borderRadius:12,padding:18,boxShadow:"0 4px 20px rgba(0,0,0,0.3)"}}>{children}</div>;
}

function App(){
  const [nP,setNP]=useState(4);
  const [cC,setCC]=useState(120000000);
  const [cT,setCT]=useState(80000000);
  const [cO,setCO]=useState(50000000);
  const [cS,setCS]=useState(15000000);
  const [cX,setCX]=useState(30000000);
  const [oc,setOc]=useState(65);
  const [kw,setKw]=useState(80);
  const [pv,setPv]=useState(1500);
  const [pc,setPc]=useState(750);
  const [hr,setHr]=useState(18);
  const [nC,setNC]=useState(2);
  const [vC,setVC]=useState(15000000);
  const [ar,setAr]=useState(8000000);
  const [no,setNo]=useState(5000000);
  const [mn,setMn]=useState(2500000);
  const [ot,setOt]=useState(1500000);
  const [tab,setTab]=useState("config");

  const c=useMemo(()=>{
    const iEq=nP*cC, iCv=cT+cO+cX, iTot=iEq+iCv+cS;
    const hEf=hr*(oc/100), kwM=nP*kw*hEf*30;
    const iKwh=kwM*pv, cEn=kwM*pc, iCnt=nC*vC, iT=iKwh+iCnt;
    const cFj=ar+no+mn+ot, cT2=cFj+cEn;
    const uB=iT-cEn, uO=iT-cT2, mar=iT>0?(uO/iT)*100:0;
    const uA=uO*12, pbk=uO>0?iTot/(uO*12):null, r5=iTot>0?((uA*5-iTot)/iTot)*100:0;
    const proy=Array.from({length:60},(_,i)=>{
      const m=i+1,gr=1+(m>6?0.008:0);
      const iM=iT*Math.pow(gr,Math.max(0,m-6)), cM=cT2*(1+m*0.001);
      return{mes:"M"+m,ingresos:Math.round(iM),costos:Math.round(cM),utilidad:Math.round(iM-cM),flujo:Math.round((iM-cM)*m-iTot)};
    });
    const desg=[
      {n:"Ing. kWh",v:iKwh},{n:"Contratos",v:iCnt},
      {n:"Energía",v:-cEn},{n:"Arriendo",v:-ar},
      {n:"Nómina",v:-no},{n:"Mantenimiento",v:-mn},{n:"Otros",v:-ot}
    ];
    return{iTot,iEq,iCv,iSw:cS,iKwh,iCnt,iT,cEn,cFj,cT2,uB,uO,mar,kwM,pbk,r5,uA,proy,desg};
  },[nP,cC,cT,cO,cS,cX,oc,kw,pv,pc,hr,nC,vC,ar,no,mn,ot]);

  const peq=c.proy.findIndex(m=>m.flujo>=0);
  const TABS=[{id:"config",l:"⚙️ Configurar"},{id:"resumen",l:"📊 Resumen"},{id:"flujo",l:"📈 Flujo de Caja"},{id:"desglose",l:"🔍 Desglose"}];

  return(
    <div style={{minHeight:"100vh",background:"#060c1a",color:"#c8d8f0",fontFamily:"Montserrat,sans-serif"}}>

      {/* HEADER */}
      <div style={{background:"linear-gradient(135deg,#0e1628,#060c1a)",borderBottom:"3px solid "+G,padding:"14px 22px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10}}>
        <div style={{display:"flex",alignItems:"center",gap:14}}>
          <img src={VOLTA_LOGO} alt="Volta Energía" style={{height:58,objectFit:"contain"}}/>
          <div style={{borderLeft:"1px solid rgba(245,166,35,0.35)",paddingLeft:14}}>
            <div style={{fontSize:9,color:G,letterSpacing:"0.2em",textTransform:"uppercase",fontWeight:700}}>Simulador Financiero</div>
            <div style={{fontSize:15,color:"#fff",fontWeight:800,marginTop:2}}>Estación de Carga EV</div>
            <div style={{fontSize:11,color:"#8a9fc0",marginTop:2}}>Simulación en tiempo real · COP</div>
          </div>
        </div>
        <div style={{textAlign:"right"}}>
          <div style={{fontFamily:"monospace",fontSize:9,color:"#3a5280",letterSpacing:"0.1em"}}>DOCUMENTO CONFIDENCIAL</div>
          <div style={{fontFamily:"monospace",fontSize:9,color:"#3a5280",marginTop:3}}>{new Date().toLocaleDateString("es-CO",{year:"numeric",month:"long",day:"numeric"})}</div>
          <div style={{display:"flex",alignItems:"center",gap:5,justifyContent:"flex-end",marginTop:7}}>
            <div style={{width:6,height:6,borderRadius:"50%",background:G,animation:"pulse 2s infinite"}}/>
            <span style={{fontFamily:"monospace",fontSize:9,color:G}}>EN VIVO</span>
          </div>
        </div>
      </div>

      {/* KPIs */}
      <div style={{padding:"13px 20px",background:"rgba(10,16,32,0.95)",borderBottom:"1px solid rgba(27,58,110,0.5)"}}>
        <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
          <KPI label="Inversión Total"    value={fmtM(c.iTot)}  sub="Capital requerido"  color="#c8d8f0" big/>
          <KPI label="Utilidad / mes"     value={fmtM(c.uO)}    sub="Operacional neta"   color={c.uO>0?G:RD} big/>
          <KPI label="Margen Operacional" value={c.mar.toFixed(1)+"%"} sub="Sobre ingresos" color={c.mar>25?G:c.mar>0?"#ffb347":RD} big/>
          <KPI label="Payback"            value={c.pbk?c.pbk.toFixed(1)+" años":"∞"} sub="Recuperación inversión" color={c.pbk&&c.pbk<4?G:"#ffb347"} big/>
        </div>
      </div>

      {/* TABS */}
      <div style={{display:"flex",borderBottom:"1px solid rgba(27,58,110,0.5)",background:"rgba(10,16,32,0.9)",overflowX:"auto"}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{padding:"11px 20px",background:"none",border:"none",cursor:"pointer",fontSize:12,fontWeight:tab===t.id?700:500,color:tab===t.id?G:"#3a5280",borderBottom:tab===t.id?"2px solid "+G:"2px solid transparent",whiteSpace:"nowrap",transition:"all .2s"}}>{t.l}</button>
        ))}
      </div>

      <div style={{padding:"18px 20px",maxWidth:1100,margin:"0 auto"}}>

        {tab==="config"&&(
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(290px,1fr))",gap:18}}>
            <Card>
              <ST>💰 Inversión Inicial</ST>
              <Slider label="Puntos de carga"        value={nP}  min={1}        max={20}        step={1}       onChange={setNP}  unit="puntos"  helper="Número de cargadores DC"/>
              <Slider label="Costo por cargador DC"  value={cC}  min={45000000} max={250000000} step={5000000} onChange={setCC}  unit="COP"     helper="Por punto instalado (60–200 kW)"/>
              <Slider label="Transformador"          value={cT}  min={30000000} max={150000000} step={5000000} onChange={setCT}  unit="COP"/>
              <Slider label="Obra civil y acometida" value={cO}  min={20000000} max={120000000} step={5000000} onChange={setCO}  unit="COP"/>
              <Slider label="Conexión distribuidora" value={cX}  min={10000000} max={80000000}  step={5000000} onChange={setCX}  unit="COP"/>
              <Slider label="Software / OCPP"        value={cS}  min={5000000}  max={50000000}  step={1000000} onChange={setCS}  unit="COP"     helper="Plataforma anual de gestión"/>
              <div style={{marginTop:12,padding:13,background:"rgba(245,166,35,0.08)",borderRadius:8,border:"1px solid rgba(245,166,35,0.25)"}}>
                <div style={{fontSize:9,color:G,fontFamily:"monospace",marginBottom:4,letterSpacing:"0.1em"}}>INVERSIÓN TOTAL</div>
                <div style={{fontSize:21,fontWeight:800,color:G,fontFamily:"monospace"}}>{fmt(c.iTot)}</div>
              </div>
            </Card>
            <Card>
              <ST>⚡ Operación & Energía</ST>
              <Slider label="Tasa de ocupación"     value={oc}  min={20}  max={95}   step={1}  onChange={setOc}  unit="%"     helper="% del tiempo en uso activo"/>
              <Slider label="kW promedio por punto" value={kw}  min={30}  max={200}  step={5}  onChange={setKw}  unit="kW"    helper="Potencia real dispensada"/>
              <Slider label="Horas operación / día" value={hr}  min={8}   max={24}   step={1}  onChange={setHr}  unit="hrs"/>
              <Slider label="Precio venta kWh"      value={pv}  min={800} max={3000} step={50} onChange={setPv}  unit="$/kWh" helper="Lo que cobras al cliente"/>
              <Slider label="Precio compra kWh"     value={pc}  min={400} max={1200} step={25} onChange={setPc}  unit="$/kWh" helper="Tarifa industrial distribuidora"/>
              <div style={{marginTop:12,padding:13,background:"rgba(27,58,110,0.2)",borderRadius:8,border:"1px solid rgba(245,166,35,0.15)"}}>
                <div style={{fontSize:9,color:G,fontFamily:"monospace",marginBottom:5,letterSpacing:"0.1em"}}>ENERGÍA DISPENSADA / MES</div>
                <div style={{fontSize:17,fontWeight:800,color:"#fff",fontFamily:"monospace"}}>{Math.round(c.kwM).toLocaleString("es-CO")} kWh</div>
                <div style={{fontSize:10,color:"#4a6290",marginTop:3}}>Ingreso: {fmtM(c.iKwh)} · Costo: {fmtM(c.cEn)}</div>
              </div>
            </Card>
            <Card>
              <ST>🤝 Contratos B2B & Costos Fijos</ST>
              <Slider label="Contratos activos"    value={nC}  min={0}       max={10}       step={1}       onChange={setNC}  unit="contratos" helper="Empresas con tarifa mensual fija"/>
              <Slider label="Valor contrato / mes" value={vC}  min={5000000} max={50000000} step={1000000} onChange={setVC}  unit="COP"       helper="Por empresa logística"/>
              <div style={{height:1,background:"rgba(27,58,110,0.5)",margin:"12px 0"}}/>
              <Slider label="Arriendo / mes"       value={ar}  min={0}       max={30000000} step={500000}  onChange={setAr}  unit="COP" helper="0 si es terreno propio"/>
              <Slider label="Nómina / mes"         value={no}  min={2000000} max={20000000} step={500000}  onChange={setNo}  unit="COP" helper="Técnico + administrativo"/>
              <Slider label="Mantenimiento / mes"  value={mn}  min={500000}  max={10000000} step={250000}  onChange={setMn}  unit="COP"/>
              <Slider label="Otros gastos / mes"   value={ot}  min={500000}  max={8000000}  step={250000}  onChange={setOt}  unit="COP" helper="Seguros, contabilidad, etc."/>
            </Card>
          </div>
        )}

        {tab==="resumen"&&(
          <div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:9,marginBottom:18}}>
              <KPI label="Ingresos kWh / mes"       value={fmtM(c.iKwh)} sub={Math.round(c.kwM).toLocaleString()+" kWh · "+oc+"% ocup."}/>
              <KPI label="Ingresos contratos B2B"   value={fmtM(c.iCnt)} sub={nC+" contrato(s) × "+fmtM(vC)}/>
              <KPI label="Total ingresos / mes"     value={fmtM(c.iT)}   color="#fff"/>
              <KPI label="Costo energía / mes"      value={fmtM(c.cEn)}  color={OR}/>
              <KPI label="Costos fijos / mes"       value={fmtM(c.cFj)}  color={OR}/>
              <KPI label="Costos totales / mes"     value={fmtM(c.cT2)}  color={OR}/>
              <KPI label="Utilidad bruta / mes"     value={fmtM(c.uB)}   color={c.uB>0?G:RD} sub="Ingresos − Costo energía"/>
              <KPI label="Utilidad operacional/mes" value={fmtM(c.uO)}   color={c.uO>0?G:RD} sub="Neta, todos los costos"/>
              <KPI label="Utilidad anual"           value={fmtM(c.uA)}   color={c.uA>0?G:RD}/>
              <KPI label="ROI a 5 años"             value={c.r5.toFixed(0)+"%"} color={c.r5>50?G:"#ffb347"} sub="Sobre inversión inicial"/>
              <KPI label="Punto de equilibrio"      value={peq>=0?"Mes "+(peq+1):"No alcanzado"} color={peq>=0&&peq<48?G:RD} sub="Recuperación inversión"/>
              <KPI label="Puntos instalados"        value={nP+" puntos DC"} sub={kw+" kW c/u"}/>
            </div>
            <Card>
              <ST>🚦 Viabilidad del Proyecto</ST>
              {[
                {label:"Margen operacional",       ok:c.mar>25,                    warn:c.mar>10,              v:c.mar.toFixed(1)+"%",                            meta:"Meta: > 25%"},
                {label:"Payback",                  ok:c.pbk&&c.pbk<4,             warn:c.pbk&&c.pbk<6,       v:c.pbk?c.pbk.toFixed(1)+" años":"∞",              meta:"Meta: < 4 años"},
                {label:"Utilidad mensual positiva",ok:c.uO>0,                     warn:c.uO>-5000000,        v:fmtM(c.uO),                                      meta:"Debe ser > $0"},
                {label:"ROI 5 años",               ok:c.r5>80,                    warn:c.r5>30,              v:c.r5.toFixed(0)+"%",                             meta:"Meta: > 80%"},
                {label:"Cobertura costos fijos",   ok:c.iCnt>=c.cFj,              warn:c.iCnt>=c.cFj*0.7,   v:((c.iCnt/(c.cFj||1))*100).toFixed(0)+"%",       meta:"Contratos ≥ costos fijos"},
              ].map((it,i)=>{
                const col=it.ok?G:it.warn?"#ffb347":RD;
                const ico=it.ok?"✅":it.warn?"⚠️":"❌";
                return(
                  <div key={i} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 0",borderBottom:"1px solid rgba(27,58,110,0.3)"}}>
                    <div style={{display:"flex",alignItems:"center",gap:9}}>
                      <span style={{fontSize:15}}>{ico}</span>
                      <div>
                        <div style={{fontSize:13,color:"#c8d8f0",fontWeight:500}}>{it.label}</div>
                        <div style={{fontSize:10,color:"#3a5280"}}>{it.meta}</div>
                      </div>
                    </div>
                    <span style={{fontFamily:"monospace",fontSize:13,fontWeight:700,color:col}}>{it.v}</span>
                  </div>
                );
              })}
            </Card>
          </div>
        )}

        {tab==="flujo"&&(
          <div style={{display:"flex",flexDirection:"column",gap:18}}>
            <Card>
              <ST>📈 Flujo de Caja Acumulado — 60 Meses</ST>
              <p style={{fontSize:11,color:"#4a6290",marginBottom:12,fontWeight:500}}>
                {peq>=0?"✅ Recuperas la inversión en el mes "+(peq+1)+" ("+((peq+1)/12).toFixed(1)+" años)":"⚠️ No se recupera la inversión en 5 años con la configuración actual."}
              </p>
              <ResponsiveContainer width="100%" height={270}>
                <AreaChart data={c.proy} margin={{top:8,right:8,left:8,bottom:0}}>
                  <defs>
                    <linearGradient id="gV" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="5%" stopColor={G} stopOpacity={0.25}/>
                      <stop offset="95%" stopColor={G} stopOpacity={0}/>
                    </linearGradient>
                  </defs>
                  <CartesianGrid strokeDasharray="3 3" stroke="rgba(27,58,110,0.4)"/>
                  <XAxis dataKey="mes" stroke="#2a3d60" tick={{fontSize:8,fontFamily:"monospace"}} interval={5}/>
                  <YAxis stroke="#2a3d60" tick={{fontSize:8,fontFamily:"monospace"}} tickFormatter={fmtM}/>
                  <Tooltip content={<Tip/>}/>
                  <ReferenceLine y={0} stroke={G} strokeDasharray="4 4" strokeWidth={1.5} label={{value:"Break-even",fill:G,fontSize:9}}/>
                  <Area type="monotone" dataKey="flujo" name="Flujo acumulado" stroke={G} strokeWidth={2} fill="url(#gV)" dot={false}/>
                </AreaChart>
              </ResponsiveContainer>
            </Card>
            <Card>
              <ST>📊 Ingresos vs Costos Mensuales</ST>
              <ResponsiveContainer width="100%" height={230}>
                <LineChart data={c.proy.filter((_,i)=>i%2===0)} margin={{top:8,right:8,left:8,bottom:0}}>
                  <CartesianGrid strokeDasharray="3 3" stroke="rgba(27,58,110,0.4)"/>
                  <XAxis dataKey="mes" stroke="#2a3d60" tick={{fontSize:8,fontFamily:"monospace"}}/>
                  <YAxis stroke="#2a3d60" tick={{fontSize:8,fontFamily:"monospace"}} tickFormatter={fmtM}/>
                  <Tooltip content={<Tip/>}/>
                  <Legend wrapperStyle={{fontSize:11}}/>
                  <Line type="monotone" dataKey="ingresos" name="Ingresos" stroke={G}       strokeWidth={2}   dot={false}/>
                  <Line type="monotone" dataKey="costos"   name="Costos"   stroke={OR}      strokeWidth={2}   dot={false}/>
                  <Line type="monotone" dataKey="utilidad" name="Utilidad" stroke="#7ab8ff" strokeWidth={1.5} strokeDasharray="4 4" dot={false}/>
                </LineChart>
              </ResponsiveContainer>
            </Card>
          </div>
        )}

        {tab==="desglose"&&(
          <div style={{display:"flex",flexDirection:"column",gap:18}}>
            <Card>
              <ST>🔍 Ingresos y Costos Mensuales</ST>
              <ResponsiveContainer width="100%" height={290}>
                <BarChart data={c.desg} layout="vertical" margin={{top:0,right:70,left:80,bottom:0}}>
                  <CartesianGrid strokeDasharray="3 3" stroke="rgba(27,58,110,0.4)" horizontal={false}/>
                  <XAxis type="number" stroke="#2a3d60" tick={{fontSize:8,fontFamily:"monospace"}} tickFormatter={fmtM}/>
                  <YAxis dataKey="n" type="category" stroke="#2a3d60" tick={{fontSize:9,fill:"#8a9fc0"}} width={80}/>
                  <Tooltip content={<Tip/>}/>
                  <Bar dataKey="v" name="Monto" radius={[0,4,4,0]} label={{position:"right",formatter:fmtM,fontSize:9,fill:G,fontFamily:"monospace"}}>
                    {c.desg.map((d,i)=><Cell key={i} fill={d.v>=0?G:OR}/>)}
                  </Bar>
                </BarChart>
              </ResponsiveContainer>
            </Card>
            <Card>
              <ST>📋 Estructura de Inversión</ST>
              {[
                {label:"Equipos ("+nP+" cargadores)", v:c.iEq,  pct:c.iTot>0?(c.iEq/c.iTot*100).toFixed(0):0,  color:G},
                {label:"Infraestructura civil",        v:c.iCv,  pct:c.iTot>0?(c.iCv/c.iTot*100).toFixed(0):0,  color:"#7ab8ff"},
                {label:"Software y plataforma",        v:c.iSw,  pct:c.iTot>0?(c.iSw/c.iTot*100).toFixed(0):0,  color:"#aaa"},
              ].map((it,i)=>(
                <div key={i} style={{marginBottom:12}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
                    <span style={{fontSize:12,color:"#c8d8f0",fontWeight:500}}>{it.label}</span>
                    <span style={{fontFamily:"monospace",fontSize:11,color:it.color}}>{fmtM(it.v)} ({it.pct}%)</span>
                  </div>
                  <div style={{height:5,background:"rgba(27,58,110,0.4)",borderRadius:3,overflow:"hidden"}}>
                    <div style={{height:"100%",width:it.pct+"%",background:it.color,borderRadius:3}}/>
                  </div>
                </div>
              ))}
            </Card>
            <Card>
              <ST>📅 Resumen Anual Proyectado</ST>
              <div style={{overflowX:"auto"}}>
                <table style={{fontSize:11,fontFamily:"monospace",borderCollapse:"collapse",width:"100%"}}>
                  <thead>
                    <tr style={{borderBottom:"1px solid rgba(245,166,35,0.2)"}}>
                      {["Año","Ingresos","Costos","Utilidad","Acumulado"].map(h=>(
                        <th key={h} style={{padding:"7px 10px",color:"#4a6290",textAlign:"right",fontWeight:400}}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {[0,1,2,3,4].map(a=>{
                      const ini=a*12,yr=c.proy.slice(ini,ini+12);
                      const ing=yr.reduce((s,m)=>s+m.ingresos,0);
                      const cst=yr.reduce((s,m)=>s+m.costos,0);
                      const util=ing-cst;
                      const acum=c.proy[Math.min(ini+11,59)]?c.proy[Math.min(ini+11,59)].flujo:0;
                      return(
                        <tr key={a} style={{borderBottom:"1px solid rgba(27,58,110,0.3)"}}>
                          <td style={{padding:"9px 10px",color:G,fontWeight:700}}>Año {a+1}</td>
                          <td style={{padding:"9px 10px",textAlign:"right",color:"#c8d8f0"}}>{fmtM(ing)}</td>
                          <td style={{padding:"9px 10px",textAlign:"right",color:OR}}>{fmtM(cst)}</td>
                          <td style={{padding:"9px 10px",textAlign:"right",color:util>0?G:RD,fontWeight:700}}>{fmtM(util)}</td>
                          <td style={{padding:"9px 10px",textAlign:"right",color:acum>0?G:RD}}>{fmtM(acum)}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </Card>
          </div>
        )}
      </div>

      <div style={{borderTop:"1px solid rgba(27,58,110,0.4)",margin:"16px 20px 0",padding:"14px 0",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
        <img src={VOLTA_LOGO} alt="Volta Energía" style={{height:24,opacity:0.45}}/>
        <span style={{fontFamily:"monospace",fontSize:9,color:"#2a3d60"}}>⚡ Cifras estimadas en COP · Documento confidencial · Ajusta en ⚙️ Configurar</span>
      </div>
      <div style={{height:20}}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));

</script>
</body>
</html>
